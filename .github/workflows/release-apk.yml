name: 发布 APK

# 推送 v* 格式的 Git Tag 时触发：云端 Gradle 编译 → 签名 → 挂载 APK 至 GitHub Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 配置了 4 个 Secrets 则用正式签名；否则回退仓库内 keystore（见 README「签名」一节）
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，使用仓库内置 keystore 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
          echo "KEYSTORE_FILE=$HOME/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        env:
          TAG: ${{ github.ref_name }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g
        run: |
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "versionName=$VERSION versionCode=$CODE"
          ./gradlew :app:assembleRelease \
            -PbuildVersionName="$VERSION" \
            -PbuildVersionCode="$CODE"
          cp app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/CampBox-v${VERSION}.apk"

      - name: 生成 Release 内容
        run: |
          if [ -f RELEASE.md ]; then
            cp RELEASE.md release_body.md
            echo "USED_RELEASE_MD=true" >> $GITHUB_ENV
          else
            PREV=$(git tag --sort=-v:refname | sed -n '2p')
            if [ -z "$PREV" ]; then
              LOG=$(git log --oneline --no-decorate HEAD)
            else
              LOG=$(git log --oneline --no-decorate "$PREV"..HEAD)
            fi

            FEAT=$(echo "$LOG" | grep -iE '^[a-f0-9]+ feat' | sed -E 's/^[a-f0-9]+ feat[：:] *//')
            FIX=$(echo "$LOG" | grep -iE '^[a-f0-9]+ fix' | sed -E 's/^[a-f0-9]+ fix[：:] *//')
            REFACTOR=$(echo "$LOG" | grep -iE '^[a-f0-9]+ (refactor|perf)' | sed -E 's/^[a-f0-9]+ (refactor|perf)[：:] *//')

            {
              echo "## 更新内容"
              echo ""

              if [ -n "$FEAT" ]; then
                echo "### ✨ 新增"
                echo "$FEAT" | sed '/^$/d' | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi

              if [ -n "$FIX" ]; then
                echo "### 🐛 修复"
                echo "$FIX" | sed '/^$/d' | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi

              if [ -n "$REFACTOR" ]; then
                echo "### ⚡ 优化"
                echo "$REFACTOR" | sed '/^$/d' | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi
            } > release_body.md

            if [ ! -s release_body.md ] || [ "$(wc -l < release_body.md)" -le 2 ]; then
              echo "## 更新内容" > release_body.md
              echo "" >> release_body.md
              echo "- 版本升级与构建优化" >> release_body.md
            fi
          fi

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: app/build/outputs/apk/release/CampBox-v*.apk
          body_path: release_body.md
          fail_on_unmatched_files: false

      - name: 清理已使用的 RELEASE.md
        if: env.USED_RELEASE_MD == 'true'
        run: |
          git fetch origin main
          git checkout main
          if [ ! -f RELEASE.md ]; then
            echo "main 分支不存在 RELEASE.md，跳过清理"
            exit 0
          fi
          git rm RELEASE.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 清理已使用的 RELEASE.md [skip ci]"
          git push origin main
